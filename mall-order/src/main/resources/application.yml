server:
  port: 8084

spring:
  application:
    name: mall-order

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/mall_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root123
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20

  redis:
    host: 127.0.0.1
    port: 6379
    database: 3  # 订单服务使用 3 号数据库

  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml

# ===== RocketMQ 配置 =====
rocketmq:
  # NameServer 地址（RocketMQ 的注册中心）
  name-server: 127.0.0.1:9876
  producer:
    # 生产者组名（事务消息需要指定生产者组）
    group: order-producer-group
    # 消息发送超时时间（毫秒）
    send-message-timeout: 3000
    # 消息最大大小（字节），默认 4MB
    max-message-size: 4194304

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.mall.order.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===== 订单配置 =====
order:
  # 订单支付超时时间（分钟），超时自动取消
  pay-timeout-minutes: 30

# ===== 定时任务配置 =====
# Spring @Scheduled 使用 cron 表达式，此处在代码中配置

logging:
  level:
    com.mall.order: DEBUG
